name: CI

on:
  push:
  pull_request:

jobs:
  offline-contract-tests:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate workspace
        run: python scripts/validate_workspace.py

